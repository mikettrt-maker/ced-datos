<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CED - Portal del Director</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4E93B8">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    :root {
      --color-primario: #4E93B8;
      --color-secundario: #E06080;
      --fondo: #F3F5F7;
      --tarjeta: #ffffff;
      --texto: #3A444D;
      --error: #c0392b;
      --ambar: #FF9060;
      --rojo: #c0392b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      font-size: 20px;
      background: var(--fondo);
      color: var(--texto);
      min-height: 100vh;
      overflow-x: hidden;
    }
    .vista { display: none; }

    header.barra {
      background: linear-gradient(135deg, #2F77A0, var(--color-secundario));
      color: #fff;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    header.barra .izq {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    header.barra img {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
      background: #fff;
      flex-shrink: 0;
    }
    header.barra h1 {
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    header.barra button {
      background: rgba(255, 255, 255, .15);
      color: #fff;
      border: 1.5px solid rgba(255, 255, 255, .5);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      text-transform: none;
      flex-shrink: 0;
    }

    main { max-width: 760px; margin: 0 auto; padding: 16px; }

    .login {
      max-width: 420px;
      margin: 60px auto;
    }
    .login .tarjeta {
      background: var(--tarjeta);
      border-radius: 14px;
      padding: 28px 24px;
      box-shadow: 0 6px 20px rgba(13, 74, 128, .15);
      text-align: center;
    }
    .login img {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      object-fit: cover;
      background: #fff;
      margin: 0 auto 14px;
      display: block;
    }
    .login h2 { font-size: 19px; }
    .login .campo { text-align: left; margin: 18px 0 14px; }
    .login .campo label {
      display: block;
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 6px;
    }
    .login .campo input {
      width: 100%;
      padding: 12px;
      border: 1.5px solid #cfdbe8;
      border-radius: 8px;
      font-size: 15px;
      font-family: inherit;
      text-transform: none;
      background: #fbfdff;
    }
    .login .campo input:focus {
      outline: none;
      border-color: var(--color-primario);
      background: #fff;
    }
    .login button {
      width: 100%;
      padding: 13px;
      background: var(--color-secundario);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      text-transform: none;
    }
    .login .aviso {
      display: none;
      margin-top: 14px;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      background: #fdecea;
      color: var(--error);
      border: 1.5px solid var(--error);
    }
    .login .aviso.visible { display: block; }

    .pestanas {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 4px;
      scroll-snap-type: x mandatory;
    }
    .pestanas::-webkit-scrollbar { display: none; }
    .pestanas button {
      flex: 0 0 auto;
      padding: 8px 8px;
      border: 1.5px solid #cfdbe8;
      border-radius: 10px;
      background: var(--tarjeta);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      text-transform: none;
      color: var(--texto);
      white-space: nowrap;
      scroll-snap-align: start;
    }
    .pestanas button.activa {
      background: var(--color-primario);
      border-color: var(--color-primario);
      color: #fff;
    }

    .tarjeta {
      background: var(--tarjeta);
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 6px 20px rgba(13, 74, 128, .12);
      margin-bottom: 16px;
    }
    .tarjeta h3 {
      font-size: 15px;
      color: var(--color-primario);
      border-bottom: 2px solid #D9E7EF;
      padding-bottom: 8px;
      margin-bottom: 12px;
    }
    .campo { margin-bottom: 14px; }
    .campo label {
      display: block;
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 6px;
    }
    .campo select,
    .campo input[type=date],
    .campo input[type=text] {
      width: 100%;
      padding: 12px;
      border: 1.5px solid #cfdbe8;
      border-radius: 8px;
      font-size: 15px;
      font-family: inherit;
      background: #fbfdff;
      text-transform: none;
    }
    .campo input[type=date] { text-transform: none; }

    .guardar {
      width: 100%;
      padding: 14px;
      margin-top: 6px;
      background: var(--color-secundario);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      text-transform: none;
    }
    .guardar:disabled { opacity: .6; cursor: not-allowed; }
    .secundario { background: var(--color-primario); }

    .aviso {
      display: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 12px;
    }
    .aviso.exito { display: block; background: #FDE9EF; color: #B84A6A; border: 1.5px solid var(--color-secundario); }
    .aviso.error { display: block; background: #fdecea; color: var(--error); border: 1.5px solid var(--error); }
    .aviso.info { display: block; background: #D9E7EF; color: var(--color-primario); border: 1.5px solid var(--color-primario); }

    .leyenda {
      font-size: 12px;
      color: #7a8a9a;
      margin-top: 10px;
      line-height: 1.7;
    }
    .leyenda b { color: var(--texto); }
    .chip {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      text-transform: none;
      margin: 0 6px 6px 0;
    }
    .chip.azul { background: #D9E7EF; color: var(--color-primario); }
    .chip.verde { background: #FDE9EF; color: #B84A6A; }
    .chip.rojo { background: #fdecea; color: var(--error); }
    .chip.ambar { background: #FFF0E6; color: var(--ambar); }
    .chip.gris { background: #eaecef; color: #4b5563; }

    .alumno {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 8px;
      border-bottom: 1px solid #eef3f8;
      flex-wrap: wrap;
    }
    .alumno .info { flex: 1; min-width: 160px; }
    .alumno .info .codigo { font-size: 11px; color: #7a8a9a; }
    .alumno .info .nombre { font-size: 13px; font-weight: 700; }
    .ver-historial {
      border: 1.5px solid var(--color-primario);
      background: #fff;
      color: var(--color-primario);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      text-transform: none;
      flex-shrink: 0;
    }
    .historial {
      display: none;
      width: 100%;
      background: #f6f9fb;
      border: 1px solid #D9E7EF;
      border-radius: 10px;
      padding: 10px 12px;
      margin-top: 6px;
    }
    .historial.visible { display: block; }
    .ficha .renglon {
      display: flex;
      gap: 8px;
      padding: 6px 2px;
      border-bottom: 1px dashed #e3ecf2;
      font-size: 13px;
    }
    .ficha .renglon:last-child { border-bottom: none; }
    .ficha .etiqueta { font-weight: 700; color: var(--color-primario); min-width: 160px; flex-shrink: 0; }
    .ficha .valor { word-break: break-word; }

    .tabla-historial {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      margin-top: 10px;
    }
    .tabla-historial th {
      background: #D9E7EF;
      color: var(--color-primario);
      padding: 6px;
      text-align: left;
      text-transform: none;
    }
    .tabla-historial td {
      padding: 6px;
      border-bottom: 1px solid #eef3f8;
      vertical-align: top;
    }

    .opcion {
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1.5px solid #cfdbe8;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 8px;
      cursor: pointer;
      font-weight: 700;
      font-size: 13px;
      text-transform: none;
      background: var(--tarjeta);
      color: var(--texto);
      user-select: none;
    }
    .opcion .marca {
      width: 20px;
      height: 20px;
      border: 2px solid #cfdbe8;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .opcion > span:last-child { min-width: 0; }
    .opcion.seleccionada {
      border-color: var(--color-primario);
      background: #eef6fd;
    }
    .opcion.seleccionada .marca {
      border-color: var(--color-primario);
      background: var(--color-primario);
    }
    .opcion.seleccionada .marca::after {
      content: '✓';
      color: #fff;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
    }

    #chat_boton {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--color-primario);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(78, 147, 184, .4);
      z-index: 9999;
      transition: transform .2s, opacity .2s;
    }
    #chat_boton:hover { transform: scale(1.1); }
    #chat_boton.chat_oculto { display: none !important; }
    #chat_boton.chat_alerta {
      animation: chat_pulso 1s ease-in-out infinite;
    }
    @keyframes chat_pulso {
      0%, 100% { box-shadow: 0 4px 16px rgba(78, 147, 184, .4); }
      50% { box-shadow: 0 4px 24px rgba(224, 96, 128, .8), 0 0 0 8px rgba(224, 96, 128, .2); }
    }
    #chat_badge {
      position: absolute;
      top: -4px;
      right: -4px;
      background: var(--color-secundario);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      min-width: 20px;
      height: 20px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 5px;
      animation: chat_badge_pop .3s ease;
    }
    @keyframes chat_badge_pop {
      0% { transform: scale(0); }
      60% { transform: scale(1.3); }
      100% { transform: scale(1); }
    }
    #chat_panel {
      position: fixed;
      top: 0;
      right: -400px;
      width: 360px;
      max-width: 100vw;
      height: 100vh;
      background: #fff;
      box-shadow: -4px 0 24px rgba(0,0,0,.2);
      z-index: 10000;
      display: flex;
      flex-direction: column;
      transition: right .3s ease;
    }
    #chat_panel.chat_visible { right: 0; }
    #chat_header {
      background: linear-gradient(135deg, #2F77A0, var(--color-secundario));
      color: #fff;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    #chat_titulo {
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #chat_header_acciones {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }
    #chat_header_acciones button {
      background: rgba(255,255,255,.15);
      border: none;
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #chat_contactos {
      border-bottom: 1px solid #eef3f8;
      max-height: 40vh;
      overflow-y: auto;
      flex-shrink: 0;
    }
    .chat_contacto {
      padding: 12px 16px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      border-bottom: 1px solid #f3f5f7;
      text-transform: none;
      color: var(--texto);
    }
    .chat_contacto:hover { background: #f6f9fb; }
    .chat_contacto.chat_activo {
      background: #eef6fd;
      color: var(--color-primario);
      border-left: 3px solid var(--color-primario);
    }
    .chat_contacto_nombre {
      flex: 1;
    }
    .chat_contacto_badge {
      background: var(--color-secundario);
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      min-width: 20px;
      height: 20px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 6px;
      margin-left: 8px;
      animation: chat_badge_pop 0.3s ease;
    }
    .chat_contacto_nuevo .chat_contacto_nombre {
      font-weight: 800;
      color: var(--color-secundario);
    }
    #chat_ventana {
      flex: 1;
      display: none;
      flex-direction: column;
      min-height: 0;
    }
    #chat_mensajes {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: #f6f9fb;
    }
    .chat_mensaje {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 13px;
      word-break: break-word;
    }
    .chat_mio {
      align-self: flex-end;
      background: var(--color-primario);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .chat_ajeno {
      align-self: flex-start;
      background: #fff;
      color: var(--texto);
      border: 1px solid #eef3f8;
      border-bottom-left-radius: 4px;
    }
    .chat_mensaje_nombre {
      font-size: 11px;
      font-weight: 700;
      margin-bottom: 4px;
      opacity: .8;
    }
    .chat_mio .chat_mensaje_nombre { color: #fff; }
    .chat_mensaje_texto { margin-bottom: 4px; }
    .chat_mensaje_hora {
      font-size: 10px;
      opacity: .6;
      text-align: right;
    }
    #chat_input_area {
      display: flex;
      gap: 8px;
      padding: 10px 12px;
      border-top: 1px solid #eef3f8;
      background: #fff;
      flex-shrink: 0;
    }
    #chat_input {
      flex: 1;
      padding: 10px 14px;
      border: 1.5px solid #cfdbe8;
      border-radius: 20px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
    }
    #chat_input:focus { border-color: var(--color-primario); }
    #chat_btn_enviar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--color-primario);
      color: #fff;
      border: none;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    #chat_btn_enviar:hover { background: #2F77A0; }
    @media (max-width: 480px) {
      #chat_panel { width: 100vw; }
    }

    /* ===== ANIMACIONES ===== */
    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .vista.activa { display: block; animation: fadeSlideIn .3s ease; }

    .tarjeta { animation: fadeSlideIn .35s ease both; }
    .tarjeta:nth-child(2) { animation-delay: .08s; }
    .tarjeta:nth-child(3) { animation-delay: .16s; }
    .tarjeta:nth-child(4) { animation-delay: .24s; }

    .guardar { transition: transform .15s ease, box-shadow .15s ease; }
    .guardar:hover:not(:disabled) { transform: scale(1.02); box-shadow: 0 4px 14px rgba(0,0,0,.15); }
    .guardar:active:not(:disabled) { transform: scale(.98); }

    .pestanas button { transition: transform .15s ease, background .2s ease, color .2s ease; }
    .pestanas button:hover:not(.activa) { transform: scale(1.05); background: #e8f0f8; }

    .aviso.exito, .aviso.error, .aviso.info { animation: slideDown .3s ease; }

    tr { transition: background .15s ease; }
    tr:hover { background: #f0f7fc; }

    .spinner {
      display: inline-block;
      width: 20px; height: 20px;
      border: 3px solid #D9E7EF;
      border-top-color: var(--color-primario);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
  </style>
</head>
<body>

  <header class="barra">
    <div class="izq">
      <img src="logo.svg" alt="Logo">
      <h1 id="titulo_barra">PORTAL DE DIRECCIÓN</h1>
    </div>
    <button type="button" id="btn_salir">SALIR</button>
  </header>

  <div id="vista_login" class="vista login activa">
    <div class="tarjeta">
      <img src="logo.svg" alt="Logo">
      <h2>CÓDIGO DEL DIRECTOR</h2>
      <div class="campo">
        <label for="codigo_director">CÓDIGO *</label>
        <input type="text" id="codigo_director" placeholder="EJ. CED-26-XXXXXX" maxlength="14">
      </div>
      <button type="button" id="btn_entrar">ENTRAR</button>
      <div class="aviso" id="aviso_login">CÓDIGO INCORRECTO. VERIFICA CON DIRECCIÓN.</div>
    </div>
  </div>

  <div id="vista_panel" class="vista">
    <main>
      <div class="pestanas">
        <button type="button" id="tab_alumnos" class="activa">ALUMNOS</button>
        <button type="button" id="tab_calificaciones">ANECDÓTICO</button>
        <button type="button" id="tab_asistencia">ASISTENCIA</button>
        <button type="button" id="tab_evalcontinua">EVAL. CONTINUA</button>
        <button type="button" id="tab_palabrasminuto">PALABRAS/MIN</button>
      </div>

      <div id="panel_alumnos" class="vista activa">
        <div class="tarjeta">
          <h3>ALUMNOS INSCRITOS</h3>
          <div class="campo">
            <label for="grado_alumnos">FILTRAR POR GRUPO</label>
            <select id="grado_alumnos"></select>
          </div>
          <button class="guardar secundario" id="btn_cargar_alumnos">CARGAR ALUMNOS</button>
          <button class="guardar" id="btn_descargar_alumnos" style="margin-top:10px">DESCARGAR TODOS (EXCEL)</button>
          <div class="aviso" id="aviso_alumnos"></div>
          <div id="contenedor_alumnos"></div>
        </div>
      </div>

      <div id="panel_calificaciones" class="vista">
        <div class="tarjeta">
          <h3>ANECDÓTICO DE LOS GRUPOS</h3>
          <div class="campo">
            <label for="grado_calif">GRUPO *</label>
            <select id="grado_calif"></select>
          </div>
          <div class="campo">
            <label for="calif_desde">DESDE</label>
            <input type="date" id="calif_desde">
          </div>
          <div class="campo">
            <label for="calif_hasta">HASTA</label>
            <input type="date" id="calif_hasta">
          </div>
          <button class="guardar secundario" id="btn_ver_calif">VER ANECDÓTICO</button>
          <div class="aviso" id="aviso_calif"></div>
          <div id="contenedor_calif"></div>
        </div>
      </div>

      <div id="panel_asistencia" class="vista">
        <div class="tarjeta">
          <h3>ASISTENCIA DE LOS GRUPOS</h3>
          <div class="campo">
            <label for="grado_asist">GRUPO *</label>
            <select id="grado_asist"></select>
          </div>
          <div class="campo">
            <label>FILTRO DE FECHAS</label>
            <div style="display:flex;gap:10px">
              <div style="flex:1">
                <label style="font-size:12px" for="asist_desde">DESDE</label>
                <input type="date" id="asist_desde">
              </div>
              <div style="flex:1">
                <label style="font-size:12px" for="asist_hasta">HASTA</label>
                <input type="date" id="asist_hasta">
              </div>
            </div>
            <p class="leyenda">Deja las fechas vacías para ver todo el ciclo escolar.</p>
          </div>
          <button class="guardar secundario" id="btn_ver_asist">VER ASISTENCIA</button>
          <button class="guardar" id="btn_descargar_asist" style="margin-top:10px">DESCARGAR (EXCEL)</button>
          <div class="aviso" id="aviso_asist"></div>
          <div id="resumen_asist"></div>
          <div id="contenedor_asist"></div>
        </div>
      </div>

      <div id="panel_evalcontinua" class="vista">
        <div class="tarjeta">
          <h3>EVALUACIÓN CONTINUA DE LOS GRUPOS</h3>
          <div class="campo">
            <label for="ec_dir_grado">GRUPO *</label>
            <select id="ec_dir_grado"></select>
          </div>
          <div class="campo">
            <label for="ec_dir_trimestre">TRIMESTRE *</label>
            <select id="ec_dir_trimestre">
              <option value="1">1ER TRIMESTRE</option>
              <option value="2">2DO TRIMESTRE</option>
              <option value="3">3ER TRIMESTRE</option>
            </select>
          </div>
          <button class="guardar secundario" id="btn_ec_dir_ver">VER EVALUACIÓN CONTINUA</button>
          <div class="aviso" id="aviso_ec_dir"></div>
          <div id="contenedor_ec_dir"></div>
        </div>
      </div>

      <div id="panel_palabrasminuto" class="vista">
        <div class="tarjeta">
          <h3>PALABRAS POR MINUTO — PRIMARIA</h3>
          <div class="campo">
            <label for="pm_dir_grado">GRUPO *</label>
            <select id="pm_dir_grado"></select>
          </div>
          <button class="guardar secundario" id="btn_pm_dir_ver">VER PALABRAS POR MINUTO</button>
          <div class="aviso" id="aviso_pm_dir"></div>
          <div id="contenedor_pm_dir"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="directores.js"></script>
  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwLp3ZNDnXMHRoqtEo3yNHo7lLPlH8IqozsEERUcoA-fShI-9JkrLhnc6ewrTm_Z8gmKQ/exec';
    const CLAVE_SESION = 'ced_director';

    const GRADOS = [
      '1° DE PRIMARIA',
      '2° DE PRIMARIA',
      '3° DE PRIMARIA',
      '4° DE PRIMARIA',
      '5° DE PRIMARIA',
      '6° DE PRIMARIA'
    ];

    const CAMPOS_FICHA = [
      'Código del alumno', 'Alumno ap. paterno', 'Alumno ap. materno', 'Alumno nombre(s)',
      'Grado', 'Fecha de nacimiento', 'Lugar de nacimiento', 'Estado', 'Municipio', 'Colonia',
      'Calle', 'Número', 'Referencia', 'Información adicional',
      'Mamá ap. paterno', 'Mamá ap. materno', 'Mamá nombre(s)', 'Mamá teléfono', 'Mamá celular', 'Mamá ocupación',
      'Papá ap. paterno', 'Papá ap. materno', 'Papá nombre(s)', 'Papá teléfono', 'Papá celular', 'Papá ocupación',
      'Emergencia ap. paterno', 'Emergencia ap. materno', 'Emergencia nombre(s)', 'Emergencia parentesco',
      'Emergencia tel 1', 'Emergencia tel 2', 'Emergencia tel 3'
    ];

    let directorActual = null;
    let alumnosTodos = [];

    const vistaLogin = document.getElementById('vista_login');
    const vistaPanel = document.getElementById('vista_panel');
    const campoCodigo = document.getElementById('codigo_director');

    campoCodigo.addEventListener('input', function () {
      campoCodigo.value = campoCodigo.value.toUpperCase();
    });

    function entrarComo(codigo) {
      codigo = String(codigo || '').replace(/[^A-Za-z0-9-]/g, '').toUpperCase();
      const director = directorPorCodigo(codigo);
      if (!director) {
        document.getElementById('aviso_login').classList.add('visible');
        return;
      }
      directorActual = director;
      localStorage.setItem(CLAVE_SESION, director.codigo);
      document.getElementById('aviso_login').classList.remove('visible');
      document.getElementById('titulo_barra').textContent = 'PORTAL DE ' + director.nombre;
      pintarSelectores();
      vistaLogin.classList.remove('activa');
      vistaPanel.classList.add('activa');
    }

    document.getElementById('btn_entrar').addEventListener('click', function () {
      entrarComo(campoCodigo.value.trim().toUpperCase());
    });

    campoCodigo.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        entrarComo(campoCodigo.value.trim().toUpperCase());
      }
    });

    document.getElementById('btn_salir').addEventListener('click', function () {
      localStorage.removeItem(CLAVE_SESION);
      window.location.href = 'inicio.html';
    });

    function pintarSelectores() {
      ['grado_alumnos', 'grado_calif', 'grado_asist'].forEach(function (id) {
        const select = document.getElementById(id);
        select.innerHTML = '';
        GRADOS.forEach(function (grado) {
          const opcion = document.createElement('option');
          opcion.value = grado;
          opcion.textContent = grado;
          select.appendChild(opcion);
        });
      });
      const filtro = document.getElementById('grado_alumnos');
      const todos = document.createElement('option');
      todos.value = 'TODOS';
      todos.textContent = 'TODOS LOS GRADOS';
      filtro.insertBefore(todos, filtro.firstChild);
      filtro.value = 'TODOS';
    }

    function cambiarPestana(cual) {
      document.getElementById('tab_alumnos').classList.toggle('activa', cual === 'alumnos');
      document.getElementById('tab_calificaciones').classList.toggle('activa', cual === 'calificaciones');
      document.getElementById('tab_asistencia').classList.toggle('activa', cual === 'asistencia');
      document.getElementById('tab_evalcontinua').classList.toggle('activa', cual === 'evalcontinua');
      document.getElementById('tab_palabrasminuto').classList.toggle('activa', cual === 'palabrasminuto');
      document.getElementById('panel_alumnos').classList.toggle('activa', cual === 'alumnos');
      document.getElementById('panel_calificaciones').classList.toggle('activa', cual === 'calificaciones');
      document.getElementById('panel_asistencia').classList.toggle('activa', cual === 'asistencia');
      document.getElementById('panel_evalcontinua').classList.toggle('activa', cual === 'evalcontinua');
      document.getElementById('panel_palabrasminuto').classList.toggle('activa', cual === 'palabrasminuto');
    }

    document.getElementById('tab_alumnos').addEventListener('click', function () {
      cambiarPestana('alumnos');
      cargarAlumnos();
    });
    document.getElementById('tab_calificaciones').addEventListener('click', function () {
      cambiarPestana('calificaciones');
      verAnecdotico();
    });
    document.getElementById('tab_asistencia').addEventListener('click', function () {
      cambiarPestana('asistencia');
      verAsistencia();
    });
    document.getElementById('tab_evalcontinua').addEventListener('click', function () {
      cambiarPestana('evalcontinua');
      initDirEvalContinua();
    });

    document.getElementById('tab_palabrasminuto').addEventListener('click', function () {
      cambiarPestana('palabrasminuto');
      initDirPalabrasMinuto();
    });

    function initDirEvalContinua() {
      var sel = document.getElementById('ec_dir_grado');
      if (sel.options.length <= 1) {
        sel.innerHTML = '';
        GRADOS.forEach(function (g) {
          var o = document.createElement('option');
          o.value = g; o.textContent = g;
          sel.appendChild(o);
        });
      }
    }

    document.getElementById('btn_ec_dir_ver').addEventListener('click', async function () {
      var grado = document.getElementById('ec_dir_grado').value;
      var trimestre = document.getElementById('ec_dir_trimestre').value;
      var aviso = document.getElementById('aviso_ec_dir');
      var contenedor = document.getElementById('contenedor_ec_dir');
      if (!grado || !trimestre) {
        aviso.className = 'aviso error';
        aviso.textContent = 'SELECCIONA GRUPO Y TRIMESTRE.';
        return;
      }
      aviso.className = 'aviso info';
      aviso.textContent = 'CARGANDO EVALUACIÓN CONTINUA...';
      contenedor.innerHTML = '';
      try {
        var resp = await fetch(SCRIPT_URL + '?' + new URLSearchParams({
          accion: 'evalcontinua_leer', grado: grado, trimestre: trimestre
        }).toString());
        var res = await resp.json();
        if (!res.ok) throw new Error('error');
        var lista = res.registros || [];
        if (lista.length === 0) {
          aviso.className = 'aviso info';
          aviso.textContent = 'NO HAY EVALUACIÓN CONTINUA PARA ' + grado + ' T' + trimestre + '.';
          return;
        }
        aviso.className = 'aviso';
        aviso.textContent = '';
        var porMateria = {};
        lista.forEach(function (r) {
          var key = r.materia + '||' + r.maestro;
          if (!porMateria[key]) porMateria[key] = [];
          porMateria[key].push(r);
        });
        var html = '';
        Object.keys(porMateria).forEach(function (key) {
          var partes = key.split('||');
          var registros = porMateria[key];
          html += '<div class="tarjeta"><h3>' + partes[0] + ' — ' + partes[1] + '</h3>';
          html += '<table class="tabla-historial"><tr><th>#</th><th>ALUMNO</th><th>DEFINITIVA</th></tr>';
          registros.forEach(function (r, idx) {
            html += '<tr><td>' + (idx + 1) + '</td><td><b>' + r.codigo + '</b><br>' + r.nombre + '</td>' +
              '<td style="font-size:18px;font-weight:800;color:var(--color-primario)">' + (r.definitiva || '—') + '</td></tr>';
          });
          html += '</table>';
          html += '<details style="margin-top:10px"><summary style="cursor:pointer;font-size:12px;color:var(--color-primario);font-weight:700">VER DETALLE POR ALUMNO</summary>';
          registros.forEach(function (r) {
            html += '<div style="border-top:1px solid #eef3f8;padding:8px 0;font-size:12px">';
            html += '<b>' + r.nombre + '</b> (' + r.codigo + ') — <b style="color:var(--color-primario)">' + (r.definitiva || '—') + '/10</b>';
            if (r.progresiones && r.progresiones.length > 0) {
              html += '<div style="margin-top:4px">';
              r.progresiones.forEach(function (p, pi) {
                html += '<span style="display:inline-block;margin-right:8px">PA.' + (pi + 1) + ' <b>' + (p.valor || '—') + '</b></span>';
              });
              html += '</div>';
            }
            html += '<div style="margin-top:2px;color:#7a8a9a">Batería: ' + (r.bateria || '—') + ' | Proyecto: ' + (r.proyecto || '—');
            if (r.escala) {
              html += ' | Higiene: ' + (r.escala.higiene || '—') + ' | Asistencia: ' + (r.escala.asistencia || '—') +
                ' | Participaciones: ' + (r.escala.participaciones || '—') + ' | Valores: ' + (r.escala.valores || '—');
            }
            html += '</div></div>';
          });
          html += '</details></div>';
        });
        contenedor.innerHTML = html;
      } catch (e) {
        aviso.className = 'aviso error';
        aviso.textContent = 'NO SE PUDIERON CARGAR LOS DATOS. VERIFICA TU INTERNET.';
        contenedor.innerHTML = '';
      }
    });

    const PARAMETROS_PM = {
      '1° DE PRIMARIA': { min: 35, max: 59 },
      '2° DE PRIMARIA': { min: 60, max: 84 },
      '3° DE PRIMARIA': { min: 85, max: 99 },
      '4° DE PRIMARIA': { min: 100, max: 114 },
      '5° DE PRIMARIA': { min: 115, max: 124 },
      '6° DE PRIMARIA': { min: 125, max: 134 }
    };

    function initDirPalabrasMinuto() {
      var sel = document.getElementById('pm_dir_grado');
      if (sel.options.length <= 1) {
        sel.innerHTML = '';
        GRADOS.forEach(function (g) {
          var o = document.createElement('option');
          o.value = g; o.textContent = g;
          sel.appendChild(o);
        });
      }
    }

    document.getElementById('btn_pm_dir_ver').addEventListener('click', async function () {
      var grado = document.getElementById('pm_dir_grado').value;
      var aviso = document.getElementById('aviso_pm_dir');
      var contenedor = document.getElementById('contenedor_pm_dir');
      if (!grado) {
        aviso.className = 'aviso error';
        aviso.textContent = 'SELECCIONA UN GRUPO.';
        return;
      }
      aviso.className = 'aviso info';
      aviso.textContent = 'CARGANDO PALABRAS POR MINUTO...';
      contenedor.innerHTML = '';
      try {
        var resp = await fetch(SCRIPT_URL + '?accion=palabrasminuto_leer&grado=' + encodeURIComponent(grado));
        var res = await resp.json();
        if (!res.ok) throw new Error('error');
        var lista = res.registros || [];
        if (lista.length === 0) {
          aviso.className = 'aviso info';
          aviso.textContent = 'NO HAY REGISTROS DE PALABRAS POR MINUTO PARA ' + grado + '.';
          return;
        }
        aviso.className = 'aviso';
        aviso.textContent = '';
        var param = PARAMETROS_PM[grado] || { min: 0, max: 0 };
        var fechas = [...new Set(lista.map(function (r) { return r.fecha; }))].sort();
        var alumnosUnicos = [...new Set(lista.map(function (r) { return r.codigo; }))];
        var html = '<div class="tarjeta"><h3>PARÁMETRO: ' + param.min + ' a ' + param.max + ' PALABRAS POR MINUTO</h3></div>';
        html += '<div class="tarjeta"><div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:12px">';
        html += '<thead><tr style="background:#D9E7EF">';
        html += '<th style="padding:6px;border:1px solid #ccc;text-align:left">ALUMNO</th>';
        fechas.forEach(function (f) {
          html += '<th style="padding:6px;border:1px solid #ccc;text-align:center">' + fechaBonita(f) + '</th>';
        });
        html += '</tr></thead><tbody>';
        alumnosUnicos.forEach(function (cod) {
          var reg = lista.find(function (r) { return r.codigo === cod; });
          html += '<tr>';
          html += '<td style="padding:5px 6px;border:1px solid #ccc;font-weight:600">' + (reg ? reg.nombre : cod) + '</td>';
          fechas.forEach(function (f) {
            var encontrado = lista.find(function (r) { return r.codigo === cod && r.fecha === f; });
            if (encontrado) {
              var val = encontrado.palabras;
              var color = (val >= param.min && val <= param.max) ? '#16a34a' : '#dc2626';
              html += '<td style="padding:5px 6px;border:1px solid #ccc;text-align:center;color:' + color + ';font-weight:700">' + val + '</td>';
            } else {
              html += '<td style="padding:5px 6px;border:1px solid #ccc;text-align:center">—</td>';
            }
          });
          html += '</tr>';
        });
        html += '</tbody></table></div></div>';
        contenedor.innerHTML = html;
      } catch (e) {
        aviso.className = 'aviso error';
        aviso.textContent = 'NO SE PUDIERON CARGAR LOS DATOS. VERIFICA TU INTERNET.';
        contenedor.innerHTML = '';
      }
    });

    function fechaBonita(iso) {
      const partes = String(iso || '').split('-');
      if (partes.length !== 3) return String(iso || '');
      const fecha = new Date(Number(partes[0]), Number(partes[1]) - 1, Number(partes[2]));
      if (isNaN(fecha.getTime())) return String(iso || '');
      const dias = ['DOMINGO', 'LUNES', 'MARTES', 'MIÉRCOLES', 'JUEVES', 'VIERNES', 'SÁBADO'];
      return dias[fecha.getDay()] + ' ' + partes[2] + '-' + partes[1] + '-' + partes[0];
    }

    function claseEstado(estado) {
      if (estado === 'ASISTIÓ') return 'verde';
      if (estado === 'RETARDO') return 'ambar';
      if (estado === 'FALTA JUSTIFICADA') return 'gris';
      return 'rojo';
    }

    function nombreCompleto(datos) {
      return [datos['Alumno ap. paterno'], datos['Alumno ap. materno'], datos['Alumno nombre(s)']]
        .filter(Boolean).join(' ').trim();
    }

    document.getElementById('btn_cargar_alumnos').addEventListener('click', cargarAlumnos);

    function cargarAlumnos() {
      const contenedor = document.getElementById('contenedor_alumnos');
      const aviso = document.getElementById('aviso_alumnos');
      aviso.className = 'aviso info';
      aviso.textContent = 'CARGANDO ALUMNOS...';
      fetch(SCRIPT_URL + '?' + new URLSearchParams({ accion: 'alumnos_todos' }).toString())
        .then(function (respuesta) { return respuesta.json(); })
        .then(function (resultado) {
          if (!resultado.ok) {
            throw new Error('error');
          }
          alumnosTodos = resultado.alumnos || [];
          alumnosTodos.sort(function (a, b) {
            return nombreCompleto(a).localeCompare(nombreCompleto(b), 'es');
          });
          const filtro = document.getElementById('grado_alumnos').value;
          const lista = filtro === 'TODOS'
            ? alumnosTodos
            : alumnosTodos.filter(function (a) { return String(a['Grado']) === filtro; });
          if (lista.length === 0) {
            aviso.className = 'aviso info';
            aviso.textContent = 'NO HAY ALUMNOS REGISTRADOS' + (filtro === 'TODOS' ? '' : ' EN ' + filtro) + '.';
            contenedor.innerHTML = '';
            return;
          }
          aviso.className = 'aviso';
          aviso.textContent = '';
          contenedor.innerHTML = '';
          lista.forEach(function (datos) {
            const fila = document.createElement('div');
            fila.className = 'alumno';
            fila.innerHTML =
              '<div class="info"><div class="codigo">' + datos['Código del alumno'] + '</div>' +
              '<div class="nombre">' + nombreCompleto(datos) + '</div></div>' +
              '<button type="button" class="ver-historial">VER FICHA</button>' +
              '<div class="historial"></div>';
            const boton = fila.querySelector('.ver-historial');
            const detalle = fila.querySelector('.historial');
            boton.addEventListener('click', function () {
              if (detalle.classList.contains('visible')) {
                detalle.classList.remove('visible');
                boton.textContent = 'VER FICHA';
                return;
              }
              detalle.classList.add('visible');
              boton.textContent = 'OCULTAR FICHA';
              let html = '<div class="ficha">';
              CAMPOS_FICHA.forEach(function (campo) {
                const valor = String(datos[campo] || '').trim();
                if (!valor) return;
                html += '<div class="renglon"><span class="etiqueta">' + campo + '</span>' +
                  '<span class="valor">' + valor + '</span></div>';
              });
              html += '<div class="renglon"><span class="etiqueta">Fecha de registro</span>' +
                '<span class="valor">' + String(datos['Fecha'] || '') + '</span></div>';
              html += '</div>';
              detalle.innerHTML = html;
            });
            contenedor.appendChild(fila);
          });
        })
        .catch(function () {
          aviso.className = 'aviso error';
          aviso.textContent = 'NO SE PUDIERON CARGAR LOS ALUMNOS. VERIFICA TU INTERNET.';
          contenedor.innerHTML = '';
        });
    }

    function celdaExcel(texto) {
      return '<td>' + String(texto).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;') + '</td>';
    }

    function descargarExcel(titulo, cabeceras, filas, nombreArchivo, avisoId) {
      let html = '<tr>';
      cabeceras.forEach(function (c) { html += '<th>' + c + '</th>'; });
      html += '</tr>' + filas;
      const tabla =
        '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel">' +
        '<head><meta charset="utf-8"></head><body><table border="1">' +
        html + '</table></body></html>';
      const blob = new Blob(['\uFEFF' + tabla], { type: 'application/vnd.ms-excel;charset=utf-8' });
      const enlace = document.createElement('a');
      enlace.href = URL.createObjectURL(blob);
      enlace.download = nombreArchivo;
      document.body.appendChild(enlace);
      enlace.click();
      document.body.removeChild(enlace);
      URL.revokeObjectURL(enlace.href);
      const aviso = document.getElementById(avisoId);
      aviso.className = 'aviso exito';
      aviso.textContent = 'ARCHIVO DESCARGADO: ' + nombreArchivo + ' (' + filas.split('<tr>').length - 1 + ' filas).';
    }

    document.getElementById('btn_descargar_alumnos').addEventListener('click', function () {
      if (alumnosTodos.length === 0) {
        cargarAlumnos();
        return;
      }
      let filas = '';
      alumnosTodos.forEach(function (datos) {
        let fila = '<tr>';
        CAMPOS_FICHA.forEach(function (campo) {
          fila += celdaExcel(datos[campo]);
        });
        fila += '</tr>';
        filas += fila;
      });
      descargarExcel('FICHA DE ALUMNOS', CAMPOS_FICHA, filas, 'ALUMNOS_INSCRITOS.xls', 'aviso_alumnos');
    });

    function filtrar(lista, desde, hasta) {
      let filtrada = lista;
      if (desde) {
        filtrada = filtrada.filter(function (r) { return r.fecha >= desde; });
      }
      if (hasta) {
        filtrada = filtrada.filter(function (r) { return r.fecha <= hasta; });
      }
      return filtrada;
    }

    document.getElementById('btn_ver_calif').addEventListener('click', verAnecdotico);

    function verAnecdotico() {
      const contenedor = document.getElementById('contenedor_calif');
      const aviso = document.getElementById('aviso_calif');
      const grado = document.getElementById('grado_calif').value;
      const desde = document.getElementById('calif_desde').value;
      const hasta = document.getElementById('calif_hasta').value;
      aviso.className = 'aviso info';
      aviso.textContent = 'CARGANDO ANECDÓTICO...';
      fetch(SCRIPT_URL + '?' + new URLSearchParams({
        accion: 'anecdotico_leer',
        grado: grado
      }).toString())
        .then(function (respuesta) { return respuesta.json(); })
        .then(function (resultado) {
          if (!resultado.ok) {
            throw new Error('error');
          }
          let lista = resultado.registros || [];
          if (desde) {
            lista = lista.filter(function (r) { return r.fecha >= desde; });
          }
          if (hasta) {
            lista = lista.filter(function (r) { return r.fecha <= hasta; });
          }
          if (lista.length === 0) {
            aviso.className = 'aviso info';
            aviso.textContent = 'NO HAY ANECDÓTICO REGISTRADO PARA ' + grado + ' EN EL RANGO SELECCIONADO.';
            contenedor.innerHTML = '';
            return;
          }
          aviso.className = 'aviso';
          aviso.textContent = '';
          var porFecha = {};
          lista.forEach(function (r) {
            if (!porFecha[r.fecha]) porFecha[r.fecha] = [];
            porFecha[r.fecha].push(r);
          });
          var filasHtml = '';
          Object.keys(porFecha).sort().reverse().forEach(function (fecha) {
            porFecha[fecha].forEach(function (r) {
              filasHtml += '<tr>' +
                '<td>' + fechaBonita(r.fecha) + '</td>' +
                '<td><b>' + r.codigo + '</b><br>' + r.nombre + '</td>' +
                '<td style="font-size:13px;max-width:300px;word-break:break-word">' + r.nota + '</td>' +
                '<td>' + r.maestro + '</td></tr>';
            });
          });
          contenedor.innerHTML =
            '<p class="leyenda" style="margin:0"><b>' + lista.length + '</b> notas — ' + grado +
            (desde || hasta ? ' (' + (desde ? fechaBonita(desde) : 'INICIO') + ' — ' + (hasta ? fechaBonita(hasta) : 'HOY') + ')' : '') + '</p>' +
            '<table class="tabla-historial">' +
            '<tr><th>FECHA</th><th>ALUMNO</th><th>NOTA</th><th>PROF.</th></tr>' +
            filasHtml + '</table>';
        })
        .catch(function () {
          aviso.className = 'aviso error';
          aviso.textContent = 'NO SE PUDIERON CARGAR LOS DATOS. VERIFICA TU INTERNET.';
          contenedor.innerHTML = '';
        });
    }

    document.getElementById('btn_ver_asist').addEventListener('click', verAsistencia);

    function verAsistencia() {
      const contenedor = document.getElementById('contenedor_asist');
      const resumen = document.getElementById('resumen_asist');
      const aviso = document.getElementById('aviso_asist');
      const grado = document.getElementById('grado_asist').value;
      const desde = document.getElementById('asist_desde').value;
      const hasta = document.getElementById('asist_hasta').value;
      aviso.className = 'aviso info';
      aviso.textContent = 'CARGANDO ASISTENCIA...';
      fetch(SCRIPT_URL + '?' + new URLSearchParams({
        accion: 'asistencias_grado',
        grado: grado
      }).toString())
        .then(function (respuesta) { return respuesta.json(); })
        .then(function (resultado) {
          if (!resultado.ok) {
            throw new Error('error');
          }
          const lista = filtrar(resultado.asistencias || [], desde, hasta);
          if (lista.length === 0) {
            aviso.className = 'aviso info';
            aviso.textContent = 'NO HAY REGISTROS DE ASISTENCIA EN EL RANGO SELECCIONADO.';
            contenedor.innerHTML = '';
            resumen.innerHTML = '';
            return;
          }
          aviso.className = 'aviso';
          aviso.textContent = '';
          let asis = 0, retardo = 0, falta = 0, justificada = 0;
          let filas = '';
          lista.forEach(function (r) {
            if (r.estado === 'ASISTIÓ') asis++;
            else if (r.estado === 'RETARDO') retardo++;
            else if (r.estado === 'FALTA') falta++;
            else if (r.estado === 'FALTA JUSTIFICADA') justificada++;
            filas += '<tr>' +
              '<td>' + fechaBonita(r.fecha) + '</td>' +
              '<td><b>' + r.codigo + '</b><br>' + r.nombre + '</td>' +
              '<td><span class="chip ' + claseEstado(r.estado) + '">' + r.estado + '</span></td>' +
              '<td>' + r.maestro + '</td></tr>';
          });
          resumen.innerHTML =
            '<span class="chip verde">ASISTIÓ: ' + asis + '</span>' +
            '<span class="chip ambar">RETARDO: ' + retardo + '</span>' +
            '<span class="chip rojo">FALTA: ' + falta + '</span>' +
            '<span class="chip gris">JUSTIFICADA: ' + justificada + '</span>';
          contenedor.innerHTML =
            '<table class="tabla-historial">' +
            '<tr><th>FECHA</th><th>ALUMNO</th><th>ESTADO</th><th>PROF.</th></tr>' +
            filas + '</table>';
        })
        .catch(function () {
          aviso.className = 'aviso error';
          aviso.textContent = 'NO SE PUDO CARGAR LA ASISTENCIA. VERIFICA TU INTERNET.';
          contenedor.innerHTML = '';
          resumen.innerHTML = '';
        });
    }

    document.getElementById('btn_descargar_asist').addEventListener('click', function () {
      const grado = document.getElementById('grado_asist').value;
      const desde = document.getElementById('asist_desde').value;
      const hasta = document.getElementById('asist_hasta').value;
      fetch(SCRIPT_URL + '?' + new URLSearchParams({
        accion: 'asistencias_grado',
        grado: grado
      }).toString())
        .then(function (respuesta) { return respuesta.json(); })
        .then(function (resultado) {
          if (!resultado.ok) {
            throw new Error('error');
          }
          const lista = filtrar(resultado.asistencias || [], desde, hasta);
          if (lista.length === 0) {
            const aviso = document.getElementById('aviso_asist');
            aviso.className = 'aviso info';
            aviso.textContent = 'NO HAY REGISTROS EN EL RANGO SELECCIONADO PARA DESCARGAR.';
            return;
          }
          let filas = '';
          lista.forEach(function (r) {
            filas += '<tr>' + celdaExcel(r.fecha) + celdaExcel(r.codigo) + celdaExcel(r.nombre) +
              celdaExcel(r.estado) + celdaExcel(r.maestro) + '</tr>';
          });
          descargarExcel('ASISTENCIA', ['FECHA', 'CÓDIGO', 'ALUMNO', 'ESTADO', 'MAESTRO'],
            filas, 'ASISTENCIA_' + grado + '.xls', 'aviso_asist');
        })
        .catch(function () {
          const aviso = document.getElementById('aviso_asist');
          aviso.className = 'aviso error';
          aviso.textContent = 'NO SE PUDO DESCARGAR. VERIFICA TU INTERNET.';
        });
    });

    const sesionGuardada = localStorage.getItem(CLAVE_SESION);
    if (sesionGuardada) {
      entrarComo(sesionGuardada);
    }
    const codigoUrl = new URLSearchParams(window.location.search).get('codigo');
    if (codigoUrl) {
      entrarComo(codigoUrl.trim().toUpperCase());
      history.replaceState(null, '', window.location.pathname);
    }
  </script>
  <script src="maestros.js"></script>
  <script src="chat.js"></script>
</body>
