<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0;url=inicio.html">
  <title>Redirigiendo...</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4E93B8">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-primario: #4E93B8;
      --color-secundario: #E06080;
      --fondo: #F3F5F7;
      --tarjeta: #ffffff;
      --texto: #3A444D;
      --error: #c0392b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Patrick Hand', cursive;
      font-size: 20px;
      background: var(--fondo);
      color: var(--texto);
      min-height: 100vh;
    }
    header {
      background: linear-gradient(135deg, var(--color-primario), #2F77A0);
      color: #fff;
      text-align: center;
      padding: 28px 16px 40px;
    }
    header .logo {
      width: 110px;
      height: 110px;
      margin: 0 auto 12px;
      border-radius: 50%;
      object-fit: cover;
      background: #fff;
      display: block;
    }
    header h1 { font-size: 22px; }
    header p { opacity: .9; margin-top: 4px; font-size: 14px; }
    main {
      max-width: 560px;
      margin: -24px auto 40px;
      padding: 0 16px;
    }
    form.tarjeta {
      background: var(--tarjeta);
      border-radius: 14px;
      padding: 22px 20px;
      box-shadow: 0 6px 20px rgba(13, 74, 128, .15);
    }
    .seccion {
      font-size: 15px;
      font-weight: 700;
      color: var(--color-primario);
      border-bottom: 2px solid #D9E7EF;
      padding-bottom: 8px;
      margin: 26px 0 16px;
    }
    .seccion:first-of-type { margin-top: 0; }
    .campo { margin-bottom: 16px; }
    .campo label {
      display: block;
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 6px;
    }
    .campo input,
    .campo select,
    .campo textarea {
      width: 100%;
      padding: 12px;
      border: 1.5px solid #cfdbe8;
      border-radius: 8px;
      font-size: 15px;
      font-family: inherit;
      background: #fbfdff;
      text-transform: uppercase;
    }
    .campo input:focus,
    .campo select:focus,
    .campo textarea:focus {
      outline: none;
      border-color: var(--color-primario);
      background: #fff;
    }
    .campo .opcional {
      font-weight: 400;
      font-size: 12px;
      color: #7a8a9a;
      text-transform: none;
    }
    .campo .ayuda {
      font-weight: 400;
      font-size: 12px;
      color: #7a8a9a;
      text-transform: none;
      margin-top: 6px;
    }
    .dos-columnas {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0 12px;
    }
    @media (max-width: 460px) {
      .dos-columnas { grid-template-columns: 1fr; }
    }
    .agregar-tel {
      display: inline-block;
      margin-top: 4px;
      background: none;
      border: 1.5px dashed var(--color-primario);
      color: var(--color-primario);
      border-radius: 8px;
      padding: 9px 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      width: auto;
      text-transform: none;
    }
    button.enviar {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      background: var(--color-secundario);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
    }
    button:disabled { opacity: .6; cursor: not-allowed; }
    .aviso {
      display: none;
      text-align: center;
      padding: 18px;
      border-radius: 10px;
      margin-bottom: 16px;
      font-size: 15px;
    }
    .aviso.exito { display: block; background: #FDE9EF; color: #B84A6A; border: 1.5px solid var(--color-secundario); }
    .aviso.error { display: block; background: #fdecea; color: var(--error); border: 1.5px solid var(--error); }
    .pie { text-align: center; font-size: 12px; color: #7a8a9a; margin-top: 18px; }
  </style>
</head>
<body>
  <p style="text-align:center;margin-top:40vh;font-family:sans-serif;color:#7a8a9a">Redirigiendo...</p>
  <script>window.location.href = 'inicio.html';</script>
</body>
</html>
